site_name: "Logic for Systems"
site_description: "Lightweight Formal Methods for Everybody"
site_url: https://forge-fm.github.io/book/
repo_url: https://github.com/forge-fm/book
repo_name: forge-fm/book

# Use file-based URLs (bst.html) instead of directory URLs (bst/)
# This preserves relative path behavior from mdbook
use_directory_urls: false

theme:
  name: material
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep blue
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep blue
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections      # Show section headers in sidebar
    - navigation.expand        # Expand all sections by default
    - navigation.indexes       # Section index pages
    - navigation.top           # Back to top button
    - search.suggest           # Search suggestions
    - search.highlight         # Highlight search terms
    - content.code.copy        # Copy button on code blocks
    - toc.follow               # TOC follows scroll position
  icon:
    repo: fontawesome/brands/github

# Extensions for admonitions, math, code highlighting, etc.
markdown_extensions:
  # Admonitions (note, warning, tip, etc.)
  - admonition
  - pymdownx.details
  - pymdownx.superfences

  # Math support (KaTeX-compatible via MathJax)
  - pymdownx.arithmatex:
      generic: true

  # Code blocks with highlighting
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite

  # Tables
  - tables

  # Table of contents
  - toc:
      permalink: true

  # Task lists, strikethrough, etc.
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.mark
  - pymdownx.tilde

  # Attribute lists (for image sizing)
  - attr_list
  - md_in_html

# JavaScript for math rendering
extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

# Extra CSS if needed
extra_css:
  - stylesheets/extra.css

# Plugins
plugins:
  - search:
      lang: en
      # Minimal separator to preserve operators like + - * in search
      separator: '[\s]+'

# Version selector (mike) - year-based versioning
extra:
  version:
    provider: mike
    default: latest

# Navigation structure (from SUMMARY.md)
nav:
  - Home: index.md

  - "Preamble: Beyond Testing":
    - What good is this book?: chapters/manifesto/job.md
    - Logic for Systems: chapters/manifesto/manifesto.md
